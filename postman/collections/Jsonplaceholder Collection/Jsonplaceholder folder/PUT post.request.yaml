$kind: http-request
url: "{{baseUrl}}/posts/1"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: "{\r

    \  \"id\": 1,\r

    \  \"title\": \"Updated title\",\r

    \  \"body\": \"Updated content\",\r

    \  \"userId\": 1\r

    }\r\n"
scripts:
