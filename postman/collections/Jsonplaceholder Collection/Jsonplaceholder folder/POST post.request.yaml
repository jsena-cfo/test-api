$kind: http-request
url: "{{baseUrl}}/posts"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \  \"title\": \"My first post\",\r

    \  \"body\": \"This is a post created using Postman\",\r

    \  \"userId\": 1\r

    }\r\n"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 201\", function () {\r

      \  pm.response.to.have.status(201);\r

      });"
    language: text/javascript
order: 3000
