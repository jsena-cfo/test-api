$kind: http-example
request:
  url: "{{baseUrl}}/airports?countryName=United States&airportCode=ATL"
  method: GET
  headers:
    - key: Accept
      value: application/problem+json
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    - key: countryName
      value: United States
    - key: airportCode
      value: ATL
      description: airport code
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    - key: Content-Type
      value: application/problem+json
    - key: Content-Type
      value: ""
  body:
    type: json
    content: |-
      {
        "type": "https://en.wikipedia.org/wiki/HTTP_500",
        "title": "Internal Server Error",
        "status": 500,
        "detail": "Internal Server Error",
        "instance": "urn:api:request:example-500",
        "correlationId": "example-correlation-id"
      }
order: 5000
