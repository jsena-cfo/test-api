$kind: http-example
request:
  url: "{{baseUrl}}/airports?countryName=United States&airportCode=ATL"
  method: GET
  headers:
    - key: Accept
      value: application/problem+json
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    - key: countryName
      value: United States
    - key: airportCode
      value: ATL
      description: airport code
