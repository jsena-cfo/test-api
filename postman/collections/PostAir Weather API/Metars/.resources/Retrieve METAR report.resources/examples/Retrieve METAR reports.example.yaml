$kind: http-example
request:
  url: "{{baseUrl}}/metars?airportCode=ATL"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    - key: airportCode
      value: ATL
      description: airport code
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
    x-correlation-id: ""
  body:
    type: json
    content: |-
      [
        {
          "code": "ATL",
          "name": "Hartsfield-Jackson Atlanta International Airport",
          "metar": {
            "raw": "KATL 251800Z 31006KT 8SM BKN025 22/14 A2998 RMK AO2 SLP145",
            "time": "251800Z",
            "wind": {
              "direction": 310,
              "speed": 6
            },
            "visibility": "8SM",
            "clouds": [
              {
                "type": "BKN",
                "height": 2500
              }
            ],
            "temperature": 22,
            "dewpoint": 14,
            "altimeter": 29.98
          }
        }
      ]
order: 1000
